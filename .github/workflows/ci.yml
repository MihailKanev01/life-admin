name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start API for E2E
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          mvn -B -ntp -Dspring.profiles.active=test test-compile dependency:build-classpath -Dmdep.scope=test -Dmdep.outputFile=/tmp/life-admin-api-classpath
          api_classpath="target/classes:$(cat /tmp/life-admin-api-classpath)"
          nohup java -cp "$api_classpath" com.lifeadmin.api.LifeAdminApiApplication --spring.profiles.active=test >/tmp/life-admin-api.log 2>&1 &
          api_pid=$!
          echo "$api_pid" >/tmp/life-admin-api.pid

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/system/health >/tmp/life-admin-health.json; then
              echo "API is ready."
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "API process exited unexpectedly."
              cat /tmp/life-admin-api.log
              exit 1
            fi
            sleep 1
          done

          echo "API did not become ready."
          cat /tmp/life-admin-api.log
          exit 1

      - name: Run Playwright smoke tests
        run: npm run test:e2e

  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Test API
        run: mvn -B -ntp test
