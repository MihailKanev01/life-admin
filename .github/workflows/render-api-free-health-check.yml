name: Free Render API health check

on:
  schedule:
    # Offset from the top of the hour to reduce schedule contention.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-render-api-health-check
  cancel-in-progress: false

jobs:
  check-api:
    name: Check API health endpoint
    runs-on: ubuntu-slim
    timeout-minutes: 6
    steps:
      - name: Retry health request while a sleeping API wakes
        shell: bash
        run: |
          set -u
          url="https://life-admin-api-9xep.onrender.com/api/v1/system/health"

          for attempt in 1 2 3 4 5 6; do
            echo "Health check attempt ${attempt}/6"
            if curl \
              --silent \
              --show-error \
              --fail \
              --connect-timeout 8 \
              --max-time 35 \
              --output /dev/null \
              --write-out "HTTP %{http_code} in %{time_total}s\n" \
              "$url"; then
              echo "Render API health endpoint responded successfully."
              exit 0
            fi

            if [ "$attempt" -lt 6 ]; then
              echo "API is not ready yet; retrying in 10 seconds."
              sleep 10
            fi
          done

          echo "::error::Render API health endpoint did not respond successfully after six attempts."
          exit 1
