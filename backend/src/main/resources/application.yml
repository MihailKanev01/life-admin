spring:
  application:
    name: life-admin-api
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080
  servlet:
    session:
      timeout: 30d
      cookie:
        name: __Host-life-admin-session
        http-only: true
        secure: ${SERVER_SESSION_COOKIE_SECURE:false}
        same-site: strict
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/life_admin}
    username: ${SPRING_DATASOURCE_USERNAME:life_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:life_admin}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:life_admin;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false