services:
  postgres:
    image: postgres:17
    container_name: life-admin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: life_admin
      POSTGRES_USER: life_admin
      POSTGRES_PASSWORD: life_admin
    ports:
      - "5432:5432"
    volumes:
      - life-admin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U life_admin -d life_admin"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: life-admin-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${LIFE_ADMIN_S3_ACCESS_KEY:life_admin_minio}
      MINIO_ROOT_PASSWORD: ${LIFE_ADMIN_S3_SECRET_KEY:life_admin_minio_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - life-admin-minio:/data
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: life-admin-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done &&
      mc mb --ignore-existing local/life-admin-documents &&
      mc anonymous set none local/life-admin-documents &&
      mc cors set local/life-admin-documents /etc/minio/cors.xml
      '
    environment:
      MINIO_ROOT_USER: ${LIFE_ADMIN_S3_ACCESS_KEY:life_admin_minio}
      MINIO_ROOT_PASSWORD: ${LIFE_ADMIN_S3_SECRET_KEY:life_admin_minio_dev_password}
    volumes:
      - ./minio-cors.xml:/etc/minio/cors.xml:ro
    restart: "no"
volumes:
  life-admin-postgres:
  life-admin-minio:
