services:
  - type: web
    name: life-admin-api
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/MihailKanev01/life-admin
    branch: feature/production-backend-hosting
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: life-admin-db
          property: connectionString
